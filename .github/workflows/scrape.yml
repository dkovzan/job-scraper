name: scrape

# Bot tick + scrape, twice daily.
# 06:00 UTC == 08:00 CEST (Polish summer) / 07:00 CET (Polish winter).
# 14:00 UTC == 16:00 CEST              / 15:00 CET.
# GH Actions cron has no DST awareness — accept the 1h winter drift, or flip
# the cron twice a year if it ever bothers us.
on:
  schedule:
    - cron: "0 6,14 * * *"
  workflow_dispatch:

permissions:
  # contents: write   — push the state-branch commit at the end of each run.
  # issues: write     — Phase 7 opens / closes "scraper-down" issues via gh.
  contents: write
  issues: write

# Shared with .github/workflows/state-orphan.yml (Phase 8) so the two
# workflows can never race on a state-branch push.
concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4

      - name: Checkout state branch into .state/
        uses: actions/checkout@v4
        with:
          ref: state
          path: .state

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install .

      - name: Run job-scraper (bot tick + scrape + deliver)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
        run: python -m main

      - name: Commit & push state changes
        working-directory: .state
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "state: no changes — skipping commit"
          else
            git -c user.name="job-scraper-bot" \
                -c user.email="bot@users.noreply.github.com" \
                commit -m "state: tick at $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:state
          fi
